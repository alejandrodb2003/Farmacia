version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pharmashare_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmashare
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # El backend y frontend se agregarán a este compose para el despliegue en VPS
  # Por ahora, levantamos solo la BD para desarrollo local.

volumes:
  db_data:
